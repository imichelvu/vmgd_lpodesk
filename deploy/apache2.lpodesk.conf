# Apache2 Virtual Host — VMGD LPODesk
# Domain  : http://lpodesk.vmgd.gov.vu
# Frontend: /var/www/lpodesk/frontend/dist   (built with `npm run build`)
# Backend : Node.js running on 127.0.0.1:5000  (managed by PM2)
#
# Required Apache2 modules:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo systemctl reload apache2
#
# Install steps:
#   sudo cp deploy/apache2.lpodesk.conf /etc/apache2/sites-available/lpodesk.conf
#   sudo a2ensite lpodesk
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName lpodesk.vmgd.gov.vu
    ServerAdmin webmaster@vmgd.gov.vu

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    DocumentRoot /var/www/lpodesk/frontend/dist

    <Directory /var/www/lpodesk/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/

        RewriteRule ^ /index.html [L]
    </Directory>

    # Static assets — long cache (Vite fingerprints filenames with content hash)
    <LocationMatch "^/assets/">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </LocationMatch>

    # ── Backend API (Node.js via PM2) ─────────────────────────────────────────
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP         "%{REMOTE_ADDR}s"

    # Allow large uploads (document files up to 10 MB)
    LimitRequestBody 10485760

    # ── Logging ───────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/lpodesk-error.log
    CustomLog ${APACHE_LOG_DIR}/lpodesk-access.log combined

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set X-Frame-Options        "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy        "strict-origin-when-cross-origin"
</VirtualHost>
