# Nginx configuration for VMGD LPODesk
# Domain  : http://lpodesk.vmgd.gov.vu
# Frontend: served from /var/www/lpodesk/dist  (built with `npm run build`)
# Backend : Node.js running on 127.0.0.1:5000  (managed by PM2)
#
# Deploy steps:
#   1. Copy this file to /etc/nginx/sites-available/lpodesk
#   2. ln -s /etc/nginx/sites-available/lpodesk /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name lpodesk.vmgd.gov.vu;

    # ── Frontend (React SPA) ─────────────────────────────────────────────────
    root /var/www/lpodesk/dist;
    index index.html;

    # All non-API routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache, immutable (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API (Node.js) ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Connection        "";

        # Allow larger payloads (document uploads up to 10 MB)
        client_max_body_size 10m;
        proxy_read_timeout   60s;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
