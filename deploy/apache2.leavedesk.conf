# Apache2 Virtual Host — VMGD LeaveDesk
# Domain  : http://leavedesk.vmgd.gov.vu
# Frontend: /var/www/leavedesk/frontend/dist   (built with `npm run build`)
# Backend : Node.js running on 127.0.0.1:5000  (managed by PM2)
#
# Required Apache2 modules:
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo systemctl reload apache2
#
# Install steps:
#   sudo cp deploy/apache2.leavedesk.conf /etc/apache2/sites-available/leavedesk.conf
#   sudo a2ensite leavedesk
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName leavedesk.vmgd.gov.vu
    ServerAdmin webmaster@vmgd.gov.vu

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    DocumentRoot /var/www/leavedesk/frontend/dist

    <Directory /var/www/leavedesk/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Client-side routing: any path that is not a real file → index.html
        RewriteEngine On
        RewriteBase /

        # Do not rewrite actual files or directories
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d

        # Do not rewrite /api/* — those are handled by ProxyPass below
        RewriteCond %{REQUEST_URI} !^/api/

        RewriteRule ^ /index.html [L]
    </Directory>

    # Static assets — long cache (Vite fingerprints filenames with content hash)
    <LocationMatch "^/assets/">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </LocationMatch>

    # ── Backend API (Node.js via PM2) ─────────────────────────────────────────
    ProxyRequests Off
    ProxyPreserveHost On

    # Proxy /api/* to the Node.js backend
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    # Forward real client IP to Node.js
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP         "%{REMOTE_ADDR}s"

    # Allow large request bodies (signature images up to ~5 MB)
    LimitRequestBody 5242880

    # ── Logging ───────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/leavedesk-error.log
    CustomLog ${APACHE_LOG_DIR}/leavedesk-access.log combined

    # ── Security headers ──────────────────────────────────────────────────────
    Header always set X-Frame-Options        "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy        "strict-origin-when-cross-origin"
</VirtualHost>
